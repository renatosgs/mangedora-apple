<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta name="description" content="MANGEDORA APPLE PRO ELITE • AURA IA • BOT PLUS">
<meta name="theme-color" content="#06070a">
<title>MANGEDORA APPLE • AURA IA</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://w3.org' viewBox='0 0 32 32'><circle cx='16' cy='16' r='15' fill='%2306070a' stroke='%233b82f6' stroke-width='2'/><path d='M16 6l9 5v6c0 5.5-4 9.5-9 11-5-1.5-9-5.5-9-11v-6l9-5z' fill='%23121724' stroke='%233b82f6' stroke-width='1.5'/><circle cx='16' cy='16' r='3.5' fill='%23f59e0b'/></svg>">
<link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>
<link href="https://googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cloudflare.com"></script>
<script src="https://jsdelivr.net"></script>
<style>
:root{--bg-base:#06070a;--bg-surface:#0c0f17;--bg-surface-elevated:#121724;--bg-card:rgba(18,23,36,.85);--border-subtle:rgba(255,255,255,.08);--border-medium:rgba(255,255,255,.18);--text-primary:#f8fafc;--text-secondary:#94a3b8;--text-tertiary:#64748b;--text-accent:#38bdf8;--accent-primary:#3b82f6;--accent-secondary:#f59e0b;--accent-glow:rgba(59,130,246,.4);--radial-1:rgba(59,130,246,.12);--radial-2:rgba(245,158,11,.08);--font-sans:'Plus Jakarta Sans',-apple-system,sans-serif;--font-mono:'JetBrains Mono',monospace;--radius-sm:8px;--radius-md:14px;--radius-lg:20px;--radius-xl:28px;--transition:all .25s cubic-bezier(.16,1,.3,1)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);background:var(--bg-base);background-image:radial-gradient(circle at 15% 10%,var(--radial-1) 0,transparent 45%),radial-gradient(circle at 85% 15%,var(--radial-2) 0,transparent 45%);background-attachment:fixed;color:var(--text-primary);min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:var(--bg-base)}::-webkit-scrollbar-thumb{background:var(--bg-surface-elevated);border-radius:4px}::-webkit-scrollbar-thumb:hover{background:var(--accent-primary)}
.app-container{max-width:1400px;margin:0 auto;padding:1.25rem 1.5rem 3rem}
.app-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;padding:1.1rem 1.6rem;background:var(--bg-card);backdrop-filter:blur(20px);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);margin-bottom:1.5rem}
.brand-section{display:flex;align-items:center;gap:.9rem}
.brand-logo-wrap{width:44px;height:44px;border-radius:var(--radius-md);background:linear-gradient(135deg,var(--accent-primary),var(--accent-secondary));display:flex;align-items:center;justify-content:center;flex-shrink:0}
.brand-logo-wrap svg{width:24px;height:24px;fill:#fff}
.brand-info h1{font-size:1.22rem;font-weight:800;display:flex;align-items:center;gap:.5rem;background:linear-gradient(90deg,#fff,var(--text-secondary));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.badge-elite{font-size:.65rem;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:.2rem .5rem;border-radius:999px;background:rgba(59,130,246,.15);border:1px solid var(--accent-primary);color:var(--text-accent);-webkit-text-fill-color:var(--text-accent)}
.badge-permanent{font-size:.6rem;font-weight:800;letter-spacing:.5px;text-transform:uppercase;padding:.15rem .4rem;border-radius:999px;background:rgba(16,185,129,.15);border:1px solid #10b981;color:#10b981}
.header-actions{display:flex;align-items:center;flex-wrap:wrap;gap:.65rem}
.storage-pill{display:flex;align-items:center;gap:.65rem;background:rgba(255,255,255,.04);border:1px solid var(--border-subtle);border-radius:999px;padding:.4rem .9rem;font-size:.8rem;font-weight:600;color:var(--text-secondary);cursor:pointer}
.storage-mini-bar{width:55px;height:6px;background:rgba(255,255,255,.1);border-radius:999px;overflow:hidden}
.storage-mini-fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent-primary),var(--accent-secondary));transition:width .4s ease}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;padding:.6rem 1.15rem;font-size:.85rem;font-weight:600;font-family:var(--font-sans);border-radius:var(--radius-md);border:1px solid transparent;cursor:pointer;transition:var(--transition);text-decoration:none;white-space:nowrap}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:linear-gradient(135deg,var(--accent-primary),var(--accent-secondary));color:#fff}
.btn-primary:hover:not(:disabled){transform:translateY(-2px)}
.btn-theme-header{background:linear-gradient(135deg,rgba(245,158,11,.18),rgba(59,130,246,.22));border:1px solid var(--accent-secondary);color:#fff}
.btn-robot{background:rgba(59,130,246,.14);border-color:var(--accent-primary);color:#fff}
.btn-botplus{background:linear-gradient(135deg,#06b6d4,#3b82f6);border:1px solid #06b6d4;color:#fff}
.btn-settings{background:rgba(255,255,255,.06);border-color:var(--border-medium);color:var(--text-primary)}
.btn-send-vault{background:linear-gradient(135deg,#10b981,#059669);border:1px solid #10b981;color:#fff}
.btn-danger{background:rgba(239,68,68,.15);border:1px solid #ef4444;color:#ef4444}
.btn-secondary{background:rgba(255,255,255,.06);border-color:var(--border-subtle);color:var(--text-secondary)}
.btn-secondary:hover{background:rgba(255,255,255,.1)}
.btn-aura{background:linear-gradient(135deg,#ec4899,#a855f7);border:1px solid #ec4899;color:#fff}
.btn-sm{padding:.4rem .8rem;font-size:.78rem;border-radius:var(--radius-sm)}
.telemetry-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem;margin-bottom:1.5rem}
.telemetry-card{background:var(--bg-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:1.2rem 1.35rem;display:flex;flex-direction:column;gap:.5rem}
.card-top{display:flex;align-items:center;justify-content:space-between}
.card-label{font-size:.75rem;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--text-secondary)}
.card-icon{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.05);color:var(--accent-primary)}
.card-val{font-size:1.5rem;font-weight:800;letter-spacing:-.5px}
.card-subtext{font-size:.75rem;color:var(--text-tertiary)}
.gf-banner{background:linear-gradient(135deg,rgba(59,130,246,.09),rgba(16,185,129,.09));border:1px solid rgba(59,130,246,.3);border-radius:var(--radius-lg);padding:1.2rem 1.5rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;margin-bottom:1.5rem}
.gf-info{display:flex;align-items:center;gap:1rem;flex:1 1 340px}
.gf-badge-icon{width:46px;height:46px;border-radius:var(--radius-md);background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.gf-texts h3{font-size:1rem;font-weight:700;margin-bottom:.2rem}
.gf-texts p{font-size:.8rem;color:var(--text-secondary);line-height:1.45}
.gf-buttons{display:flex;align-items:center;flex-wrap:wrap;gap:.6rem}
.toolbar{background:var(--bg-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:.85rem 1.15rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.85rem;margin-bottom:1.35rem}
.filter-tabs{display:flex;align-items:center;flex-wrap:wrap;gap:.4rem}
.filter-btn{padding:.4rem .8rem;border-radius:999px;font-size:.8rem;font-weight:600;background:transparent;border:1px solid transparent;color:var(--text-secondary);cursor:pointer}
.filter-btn.active{background:var(--accent-primary);color:#fff}
.search-sort-wrap{display:flex;align-items:center;gap:.65rem;flex-grow:1;max-width:440px}
.search-input{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:.55rem .9rem;font-size:.85rem;color:var(--text-primary);font-family:var(--font-sans);transition:var(--transition)}
.search-input:focus{outline:none;border-color:var(--accent-primary);box-shadow:0 0 0 3px var(--accent-glow)}
.sort-select{background:rgba(255,255,255,.04);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:.55rem .9rem;font-size:.85rem;color:var(--text-primary);font-family:var(--font-sans);cursor:pointer}
.sort-select:focus{outline:none;border-color:var(--accent-primary)}

.main-content{display:grid;grid-template-columns:1fr;gap:1.5rem}
@media(min-width:992px){.main-content{grid-template-columns:2fr 1fr}}

.vault-section,.panel-section{background:var(--bg-card);backdrop-filter:blur(20px);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:1.5rem;display:flex;flex-direction:column;gap:1.25rem}
.section-title{font-size:1.1rem;font-weight:700;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border-subtle);padding-bottom:.75rem;margin-bottom:.25rem}

.dropzone{border:2px dashed var(--border-medium);border-radius:var(--radius-md);padding:2rem;text-align:center;background:rgba(255,255,255,.02);cursor:pointer;transition:var(--transition)}
.dropzone:hover{border-color:var(--accent-primary);background:rgba(59,130,246,.04)}
.dropzone p{font-size:.85rem;color:var(--text-secondary);margin-top:.5rem}

.file-list{display:flex;flex-direction:column;gap:.75rem;max-height:500px;overflow-y:auto;padding-right:.25rem}
.file-item{background:var(--bg-surface-elevated);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:.85rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;transition:var(--transition)}
